[workspace]
members = [
    "crates/bookmcp-core",
    "crates/bookmcp-ingest",
    "crates/bookmcp-index",
    "crates/bookmcp-cli",
    "crates/bookmcp-mcp",
    "crates/bookmcp-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Prem5123/BookMCP"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
bookmcp-core = { path = "crates/bookmcp-core" }
bookmcp-index = { path = "crates/bookmcp-index" }
bookmcp-ingest = { path = "crates/bookmcp-ingest" }
bookmcp-mcp = { path = "crates/bookmcp-mcp" }
bookmcp-store = { path = "crates/bookmcp-store" }
directories = "6.0.0"
hex = "0.4.3"
pdf-extract = "0.12.0"
lopdf = { version = "0.42.0", default-features = false }
rusqlite = { version = "0.40.0", features = ["bundled"] }
sha2 = "0.11.0"
tantivy = "0.26.1"
tempfile = "3.27.0"
time = { version = "0.3.47", features = ["formatting"] }
anyhow = "1.0.102"
clap = { version = "4.6.1", features = ["derive"] }
rmcp = { version = "3.2.0", features = ["transport-io"] }
tokio = { version = "1.52.3", features = ["rt", "macros", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }
