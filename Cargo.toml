[workspace]
members = [
    "crates/bookmcp-core",
    "crates/bookmcp-store",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://example.invalid/bookmcp"
rust-version = "1.96"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
schemars = { version = "1.2.1", features = ["derive"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.18"
bookmcp-core = { path = "crates/bookmcp-core" }
directories = "6.0.0"
rusqlite = { version = "0.40.0", features = ["bundled"] }
tempfile = "3.27.0"
