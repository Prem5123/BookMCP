name: Release binaries

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --locked --workspace --all-features --target '${{ matrix.target }}'
      - run: cargo build --locked --release -p bookmcp-cli --target '${{ matrix.target }}'
      - name: Package executable, documentation, licenses, and checksum
        run: python3 .github/scripts/package-release.py '${{ matrix.target }}'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bookmcp-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  bundle:
    name: Package portable MCP bundle
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bookmcp-*
          path: dist
          merge-multiple: true
      - name: Validate the bundle manifest
        run: npm exec --yes --package=@anthropic-ai/mcpb@2.1.2 -- mcpb validate .github/mcpb/manifest.json
      - name: Assemble five native binaries and exact Registry metadata
        run: python3 .github/scripts/package-mcpb.py
      - name: Verify Registry metadata and bundled executables
        run: python3 .github/scripts/verify-registry.py "v$(python3 -c 'import json; print(json.load(open("server.json"))["version"])')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bookmcp-mcpb
          path: |
            dist/*.mcpb
            dist/*.mcpb.sha256
            dist/server.json
          if-no-files-found: error

  smoke-bundle:
    name: Smoke MCPB (${{ matrix.os }})
    needs: bundle
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, macos-15-intel, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bookmcp-mcpb
          path: dist
      - name: Exercise bundle launch, ingestion, and MCP retrieval
        run: python3 .github/scripts/smoke-mcpb.py dist/*.mcpb

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, bundle, smoke-bundle]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: bookmcp-*
          path: dist
          merge-multiple: true
      - name: Create draft release for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
